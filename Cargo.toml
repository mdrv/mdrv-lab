[package]
name = "mdrv-lab"
version = "0.1.0"
edition = "2021"
publish = false
description = "GPUI-on-Android lab: mdrv-db CRUD + image transforms + 3D orbit"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "mdrv-lab"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = []
desktop = ["dep:gpui_platform"]

[dependencies]
gpui = { package = "mdrv-gpui-ce", git = "https://github.com/mdrv/gpui-ce", tag = "mdrv-gpui-0.0.260930.0", default-features = false }
# gpui = { package = "mdrv-gpui-ce", path = "/g/gpui-ce/crates/gpui", default-features = false } # DEV
gpui_wgpu = { package = "mdrv-gpui-wgpu", git = "https://github.com/mdrv/gpui-ce", tag = "mdrv-gpui-0.0.260930.0", features = ["font-kit"] }
# gpui_wgpu = { package = "mdrv-gpui-wgpu", path = "/g/gpui-ce/crates/gpui_wgpu", features = ["font-kit"] } # DEV
mdrv-gpui-mobile = { path = "/g/mdrv-gpui-mobile" }
mdrv-db = { path = "/g/mdrv-db/crates/mdrv-db", features = ["turso"] }
wgpu = "29.0.3"
gltf = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
bytemuck = { version = "1", features = ["derive"] }
anyhow = "1"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
gpui_platform = { package = "mdrv-gpui-platform", git = "https://github.com/mdrv/gpui-ce", tag = "mdrv-gpui-0.0.260930.0", optional = true, features = ["wayland"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
